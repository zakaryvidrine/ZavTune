name: Build ZavTune

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target ZavTune_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: ZavTune-Windows-VST3
          path: build/ZavTune_artefacts/Release/VST3/ZavTune.vst3

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target ZavTune_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: ZavTune-macOS-VST3
          path: build/ZavTune_artefacts/Release/VST3/ZavTune.vst3
